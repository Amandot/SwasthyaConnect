version: '3.8'

services:
  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: telehealth-frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VITE_API_URL=http://backend:5000/api
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - telehealth-network

  # Backend service
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: telehealth-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - FRONTEND_URL=http://frontend
    env_file:
      - ./server/.env
    restart: unless-stopped
    networks:
      - telehealth-network
    volumes:
      - ./server/config:/app/config:ro

networks:
  telehealth-network:
    driver: bridge

volumes:
  backend-data:
